{{- if .Values.dashboards.enabled }}
{{- $dashboards := dict "overview" .Values.dashboards.overview "cache-servers" .Values.dashboards.cacheServers "clients" .Values.dashboards.clients "controller" .Values.dashboards.controller }}
{{- range $name := keys $dashboards | sortAlpha }}
{{- if get $dashboards $name }}
{{- $file := printf "dacs-%s.json" $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dacs-mixin.fullname" $ }}-dashboard-{{ $name }}
  namespace: {{ default $.Release.Namespace $.Values.dashboards.namespace }}
  labels:
    {{- include "dacs-mixin.labels" $ | nindent 4 }}
    {{- with $.Values.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ $file }}: |-
    {{- $.Files.Get (printf "files/dashboards/%s" $file) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
