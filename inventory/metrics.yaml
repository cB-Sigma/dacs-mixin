# Machine-readable metric inventory. This file is the allow-list used by
# scripts/check_metrics.py: a dashboard or rule that references a metric,
# label or label value not listed here fails CI.
#
# status:
#   verified         name, type and labels read directly from source
#   derived          OTLP name read from source; the Prometheus name follows
#                    the standard OTLP translation and depends on the pipeline
#   external         standard metric from another project
#   config-supplied  series the operator has to provide
#
# labels: a null value means "any value"; a list enumerates every value the
# source can emit. Human-readable version: docs/metrics.md
verified_against:
  repository: https://github.com/Azure/dacs
  commit: 27ec57c
  commit_date: '2026-11-11'
target_labels:
- job
- instance
- namespace
- pod
- container
- cache
- endpoint
- service
- le
- quantile
